<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroNext.ai | Astrologer Registration</title>
    <style>
        /* ... (your existing CSS styles) ... */
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="registration-card">
    <div class="header-section">
        <h1>AstroNext<span style="font-weight:400">.ai</span></h1>
        <div class="badge"><i class="fas fa-chart-line"></i> Astrologer Registration</div>
        <p style="font-size: 0.8rem; color: #6c4f2c; margin-top: 12px;">
            Join AstroNext.ai and grow your astrology practice with your own branded presence, direct client leads, SEO visibility, 
            Meta Ads promotion, and premium digital support.
        </p>
    </div>

    <form id="astroRegisterForm">
        <div class="form-grid">
            <div class="field-group">
                <label><i class="fas fa-user"></i> Full Name <span style="color:#c45d2c;">*</span></label>
                <input type="text" id="fullname" required>
            </div>
            <div class="field-group">
                <label><i class="fab fa-whatsapp"></i> Mobile Number / WhatsApp Number <span style="color:#c45d2c;">*</span></label>
                <input type="tel" id="mobile" required>
            </div>
            <div class="field-group">
                <label><i class="fas fa-envelope"></i> Email ID <span style="color:#c45d2c;">*</span></label>
                <input type="email" id="email" required>
            </div>
            <div class="field-group">
                <label><i class="fas fa-map-marker-alt"></i> Full Address</label>
                <textarea id="address" rows="2"></textarea>
            </div>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <div class="field-group" style="flex:1"><label><i class="fas fa-city"></i> City</label><input type="text" id="city"></div>
                <div class="field-group" style="flex:1"><label><i class="fas fa-landmark"></i> State</label><input type="text" id="state"></div>
            </div>
            <div class="field-group">
                <label><i class="fas fa-calendar-alt"></i> Years of Service / Experience</label>
                <input type="text" id="experience">
            </div>
            <div class="field-group">
                <label><i class="fas fa-language"></i> Languages You Can Consult In</label>
                <div id="langContainer" class="options-wrapper"></div>
            </div>
            <div class="field-group">
                <label><i class="fas fa-star-of-life"></i> Speciality</label>
                <div id="specialityContainer" class="options-wrapper"></div>
            </div>
            <div class="field-group">
                <label><i class="fas fa-rupee-sign"></i> Consultation Charges <span style="color:#c45d2c;">*</span></label>
                <input type="text" id="charges" required>
            </div>
            <div class="field-group">
                <label><i class="fas fa-clock"></i> Preferred Contact Time</label>
                <div id="timeContainer" class="options-wrapper"></div>
            </div>
            <div class="field-group">
                <label><i class="fas fa-pen-fancy"></i> Additional Notes</label>
                <textarea id="additional_notes" rows="2"></textarea>
            </div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
            <i class="fas fa-paper-plane"></i> Register with AstroNext <i class="fas fa-chart-line"></i>
        </button>
        <div id="formStatus" class="status-area"></div>
    </form>
    <div class="footer-note"><i class="fas fa-shield-alt"></i> Your information is secure.</div>
</div>

<script>
    // ========================
    // 1. Generate Dynamic Checkboxes & Radio Options
    // ========================
    const languagesList = ["Hindi","English","Odia","Bengali","Telugu","Tamil","Kannada","Malayalam","Marathi","Gujarati","Punjabi","Other"];
    const specialityList = [
        "Vedic Astrology","Tarot Reading","Numerology","Palmistry","Vastu Shastra","Kundli Matching",
        "Marriage & Relationship","Career Guidance","Business Guidance","Finance & Wealth","Health Astrology",
        "Love Problems","Education Guidance","Gemstone Consultation","Reiki Healing","Spiritual Healing",
        "Prashna Kundli","Face Reading","Nadi Astrology","Other"
    ];
    const timeSlots = ["Morning","Afternoon","Evening","Anytime"];

    function renderOptions(containerId, items, type, name) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.innerHTML = '';
        items.forEach(item => {
            const label = document.createElement('label');
            const input = document.createElement('input');
            input.type = type;
            input.name = name;
            input.value = item;
            label.appendChild(input);
            label.appendChild(document.createTextNode(' ' + item));
            container.appendChild(label);
        });
    }

    renderOptions('langContainer', languagesList, 'checkbox', 'langs');
    renderOptions('specialityContainer', specialityList, 'checkbox', 'speciality');
    renderOptions('timeContainer', timeSlots, 'radio', 'preferTime');

    function getSelectedCheckboxValues(name) {
        const checkboxes = document.querySelectorAll(`input[name="${name}"]:checked`);
        return Array.from(checkboxes).map(cb => cb.value).join(', ');
    }

    // ========================
    // 2. Form Submission (Fixed for Vercel)
    // ========================
    // *** IMPORTANT: Replace this URL with your own Apps Script Web App URL ***
    const SCRIPT_URL = "https://script.google.com/a/macros/iiit-bh.ac.in/s/AKfycbwyRUEZ8nOhNulNCySHY7VRgjcyM8PTX_CXinMXw5LFmy0bREDqMFSuVaYwxM3HrECF/exec";
    const form = document.getElementById('astroRegisterForm');
    const statusDiv = document.getElementById('formStatus');

    function showMessage(msg, isError = false) {
        statusDiv.innerHTML = `<div style="background: ${isError ? '#f8ddd7' : '#e2f0da'}; border-radius: 40px; padding: 8px; color: ${isError ? '#b13e22' : '#2c641e'};"><i class="fas ${isError ? 'fa-exclamation-triangle' : 'fa-check-circle'}"></i> ${msg}</div>`;
        setTimeout(() => { if(statusDiv) statusDiv.innerHTML = ''; }, 6000);
    }

    // This function uses `mode: 'no-cors'` to bypass the CORS error on Vercel.
    // With `no-cors`, we cannot read the response from the script, but the
    // request is still sent and the data is saved to the sheet successfully.
    async function submitToSheet(formDataObj) {
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // <-- This is the fix for the CORS error.
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams(formDataObj).toString()
            });
            return { success: true };
        } catch (err) {
            console.error("Fetch error:", err);
            return { success: false, error: err.message };
        }
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Submitting...';

        const fullname = document.getElementById('fullname').value.trim();
        const mobile = document.getElementById('mobile').value.trim();
        const email = document.getElementById('email').value.trim();
        const charges = document.getElementById('charges').value.trim();

        if (!fullname) { showMessage("Full Name is required.", true); resetBtn(); return; }
        if (!mobile) { showMessage("Mobile Number is required.", true); resetBtn(); return; }
        if (!email) { showMessage("Email ID is required.", true); resetBtn(); return; }
        const emailPattern = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
        if (!emailPattern.test(email)) { showMessage("Valid email required.", true); resetBtn(); return; }
        if (!charges) { showMessage("Consultation Charges are required.", true); resetBtn(); return; }

        const payload = {
            timestamp: new Date().toISOString(),
            fullname, mobile, email,
            address: document.getElementById('address').value,
            city: document.getElementById('city').value,
            state: document.getElementById('state').value,
            experience: document.getElementById('experience').value,
            languages: getSelectedCheckboxValues('langs'),
            speciality: getSelectedCheckboxValues('speciality'),
            charges: charges,
            preferred_contact_time: document.querySelector('input[name="preferTime"]:checked')?.value || '',
            additional_notes: document.getElementById('additional_notes').value
        };

        const result = await submitToSheet(payload);
        if (result.success) {
            showMessage("✅ Registration submitted successfully! Our team will contact you soon.");
            form.reset();
            document.querySelectorAll('input[type="checkbox"], input[type="radio"]').forEach(el => el.checked = false);
        } else {
            showMessage("❌ Submission failed: " + result.error, true);
        }
        
        function resetBtn() {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Register with AstroNext <i class="fas fa-chart-line"></i>';
        }
        resetBtn();
    });
</script>
</body>
</html>
